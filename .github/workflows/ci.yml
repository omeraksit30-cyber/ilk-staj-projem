name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application through deployment entrypoint
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements.txt
          python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Dependency audit
        run: python -m pip_audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag restaurant-support-assistant:ci .
